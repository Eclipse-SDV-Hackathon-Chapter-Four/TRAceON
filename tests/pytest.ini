[pytest]
# Resolve `from conftest import ...` and keep this directory importable.
pythonpath = .
# Only collect this suite; never descend into the opensovd-core submodule,
# which ships its own conflicting conftest.py / pytest_plugins.
testpaths = .
norecursedirs = ../open_source ../target
addopts = -v --tb=short
markers =
    smoke: Fast reachability / discovery checks.
    integration: End-to-end checks against a running SOVD server.
    performance: Latency smoke checks (not rigorous benchmarks).
    sovd_logging: Tests for the SOVD logging resource.
