<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>TRAceON — SOVD Log Viewer</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0d1117;--surface:#161b22;--border:#30363d;
      --text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;
      --fatal:#ff7b72;--error:#ffa657;--warn:#e3b341;--info:#3fb950;--debug:#8b949e;
    }
    body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px}
    header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
    header h1{font-size:18px;font-weight:700;color:var(--accent)}
    header .sub{font-size:11px;color:var(--muted)}
    #dot{width:9px;height:9px;border-radius:50%;background:var(--debug);margin-left:auto}
    #dot.ok{background:var(--info)} #dot.err{background:var(--fatal)}
    #status{font-size:12px;color:var(--muted)}

    main{display:grid;grid-template-columns:1fr 320px;height:calc(100vh - 49px)}

    /* log panel */
    .log-panel{display:flex;flex-direction:column;border-right:1px solid var(--border)}
    .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--border)}
    .toolbar label{font-size:12px;color:var(--muted)}
    select,input{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:4px 8px;font-size:12px}
    button{background:var(--accent);color:#0d1117;border:none;border-radius:5px;padding:4px 12px;font-size:12px;font-weight:700;cursor:pointer}
    button.sec{background:var(--surface);color:var(--text);border:1px solid var(--border)}
    button:hover{opacity:.85}
    .spacer{flex:1}
    #count{font-size:12px;color:var(--muted)}

    .tbl-wrap{flex:1;overflow-y:auto}
    table{width:100%;border-collapse:collapse}
    thead th{position:sticky;top:0;background:var(--surface);padding:7px 10px;text-align:left;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border)}
    tbody tr{border-bottom:1px solid #21262d;cursor:pointer}
    tbody tr:hover{background:#1c2128}
    td{padding:6px 10px;font-size:12px;vertical-align:top}
    .ts{color:var(--muted);font-family:monospace;font-size:11px;white-space:nowrap}
    .ctx{color:var(--muted);font-size:11px}
    .msg{word-break:break-word}
    .badge{display:inline-block;padding:1px 7px;border-radius:8px;font-size:10px;font-weight:700}
    .FATAL{color:var(--fatal)} .ERROR{color:var(--error)} .WARN{color:var(--warn)} .INFO{color:var(--info)} .DEBUG{color:var(--debug)}
    .b-FATAL{background:#3d1a1a;color:var(--fatal)} .b-ERROR{background:#3d2a1a;color:var(--error)}
    .b-WARN{background:#3d3010;color:var(--warn)}   .b-INFO{background:#1a3d1a;color:var(--info)}
    .b-DEBUG{background:#1e2530;color:var(--debug)}
    .empty{display:flex;align-items:center;justify-content:center;height:160px;color:var(--muted);font-size:13px}

    /* config panel */
    .cfg-panel{display:flex;flex-direction:column;overflow-y:auto}
    .cfg-panel h2{padding:12px 14px;font-size:13px;font-weight:700;background:var(--surface);border-bottom:1px solid var(--border)}
    .cfg-body{padding:14px;display:flex;flex-direction:column;gap:10px}
    .cfg-body label{font-size:11px;color:var(--muted)}
    .cfg-body select{width:100%}
    #cur-cfg{font-size:12px;color:var(--muted);padding:4px 0}
    .cfg-btns{display:flex;gap:8px}
    .cfg-btns button{flex:1}
    #cfg-msg{padding:7px 10px;border-radius:5px;font-size:12px;display:none;margin-top:4px}
    #cfg-msg.ok{background:#1a3d1a;color:var(--info);display:block}
    #cfg-msg.err{background:#3d1a1a;color:var(--fatal);display:block}

    /* detail */
    #detail{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 20px;max-height:200px;overflow-y:auto;font-family:monospace;font-size:11px;display:none}
    #detail.open{display:block}
    #det-close{float:right;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:0}
  </style>
</head>
<body>
<header>
  <svg width="26" height="26" viewBox="0 0 28 28" fill="none">
    <rect width="28" height="28" rx="6" fill="#1f6feb"/>
    <path d="M7 9h14M7 14h10M7 19h12" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  </svg>
  <div><h1>TRAceON</h1><div class="sub">SOVD Log Viewer · diag-app</div></div>
  <div id="dot"></div>
  <span id="status">connecting…</span>
</header>

<main>
  <section class="log-panel">
    <div class="toolbar">
      <label>Severity</label>
      <select id="f-sev">
        <option value="">All</option>
        <option value="fatal">Fatal</option>
        <option value="error">Error</option>
        <option value="warn">Warn</option>
        <option value="info">Info</option>
        <option value="debug">Debug</option>
      </select>

      <label>After</label>
      <select id="after-h"><option value="">HH</option></select>
      <span style="color:var(--muted);font-size:13px">:</span>
      <select id="after-m"><option value="">MM</option></select>
      <span style="color:var(--muted);font-size:13px">:</span>
      <select id="after-s"><option value="">SS</option></select>

      <label>Before</label>
      <select id="before-h"><option value="">HH</option></select>
      <span style="color:var(--muted);font-size:13px">:</span>
      <select id="before-m"><option value="">MM</option></select>
      <span style="color:var(--muted);font-size:13px">:</span>
      <select id="before-s"><option value="">SS</option></select>

      <button class="sec" id="btn-clear-time">✕ Clear</button>

      <label>Search</label>
      <input id="f-txt" placeholder="message…" style="width:140px"/>
      <div class="spacer"></div>
      <label><input type="checkbox" id="auto" checked/> Auto</label>
      <button class="sec" id="btn-ref">↻ Refresh</button>
      <span id="count"></span>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th style="width:72px">Sev</th>
          <th style="width:150px">Timestamp</th>
          <th style="width:180px">Context</th>
          <th>Message</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none">No log entries</div>
    </div>
  </section>

  <aside class="cfg-panel">
    <h2>⚙ Log Configuration</h2>
    <div class="cfg-body">
      <label>Context Type</label>
      <select id="cfg-ctx">
        <option value="RFC5424">RFC 5424</option>
        <option value="AUTOSAR_DLT">AUTOSAR DLT</option>
      </select>
      <div id="cur-cfg">Loading…</div>
      <label>Min Severity</label>
      <select id="cfg-sev">
        <option value="fatal">Fatal</option>
        <option value="error">Error</option>
        <option value="warn">Warn</option>
        <option value="info" selected>Info</option>
        <option value="debug">Debug</option>
      </select>
      <div class="cfg-btns">
        <button id="btn-apply">Apply</button>
        <button class="sec" id="btn-reset">Reset</button>
      </div>
      <div id="cfg-msg"></div>
    </div>
  </aside>
</main>

<div id="detail">
  <button id="det-close">✕</button>
  <pre id="det-body"></pre>
</div>

<script>
  const BASE = 'http://172.26.10.72:8080/sovd';
  const APP  = 'hw-log';
  const ENTRIES_URL = `${BASE}/v1/apps/${APP}/logs/entries`;
  const CONFIG_URL  = `${BASE}/v1/apps/${APP}/logs/config`;

  let entries = [];
  let config  = [];
  let timer   = null;

  // ── fetch entries ───────────────────────────────────────────────────
  async function fetchEntries() {
    const sev    = document.getElementById('f-sev').value;
    const params = new URLSearchParams();
    if (sev) params.set('severity', sev.toLowerCase());
    const url = params.size ? `${ENTRIES_URL}?${params}` : ENTRIES_URL;
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const d = await r.json();
      entries = d.items ?? d ?? [];
      setDot(true);
    } catch(e) {
      setDot(false, e.message);
      entries = [];
    }
    render();
  }

  function render() {
    const txt = document.getElementById('f-txt').value.toLowerCase();

    const rows = entries.filter(e => {
      if (txt && !(e.msg||'').toLowerCase().includes(txt)) return false;
      if (e.timestamp) {
        const t    = new Date(e.timestamp);
        const secs = t.getUTCHours() * 3600 + t.getUTCMinutes() * 60 + t.getUTCSeconds();
        const after  = getTimeSecs('after');
        const before = getTimeSecs('before');
        if (after  !== null && secs < after)  return false;
        if (before !== null && secs > before) return false;
      }
      return true;
    });
    const tbody = document.getElementById('tbody');
    const empty = document.getElementById('empty');
    document.getElementById('count').textContent = rows.length + ' entries';
    if (!rows.length) { tbody.innerHTML=''; empty.style.display='flex'; return; }
    empty.style.display = 'none';
    tbody.innerHTML = rows.map((e,i) => {
      const s  = normSev(e.severity);
      const ts = e.timestamp ? new Date(e.timestamp).toLocaleTimeString('en-GB', {timeZone:'UTC', hour:'2-digit', minute:'2-digit', second:'2-digit'}) + ' UTC' : '—';
      const ctx = fmtCtx(e.context);
      return `<tr data-i="${i}">
        <td><span class="badge b-${s}">${s}</span></td>
        <td class="ts">${ts}</td>
        <td class="ctx">${esc(ctx)}</td>
        <td class="msg">${esc(e.msg||'')}</td>
      </tr>`;
    }).join('');
    tbody.querySelectorAll('tr').forEach(tr =>
      tr.addEventListener('click', () => showDetail(rows[+tr.dataset.i]))
    );
  }

  // ── fetch config ────────────────────────────────────────────────────
  async function fetchConfig() {
    try {
      const r = await fetch(CONFIG_URL);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const d = await r.json();
      config = d.contexts ?? [];
      renderConfig();
    } catch {
      document.getElementById('cur-cfg').textContent = 'Unavailable';
    }
  }

  function renderConfig() {
    const ctx  = document.getElementById('cfg-ctx').value;
    const item = config.find(c => c.context?.type === ctx);
    const el   = document.getElementById('cur-cfg');
    if (!item) { el.textContent = 'No config for this context'; return; }
    const s = normSev(item.severity);
    el.innerHTML = `Current: <span class="badge b-${s}">${s}</span>`;
    document.getElementById('cfg-sev').value = s.toLowerCase();
  }

  // ── apply / reset config ────────────────────────────────────────────
  document.getElementById('btn-apply').addEventListener('click', async () => {
    const ctx = document.getElementById('cfg-ctx').value;
    const sev = document.getElementById('cfg-sev').value;
    try {
      const r = await fetch(CONFIG_URL, {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ items: [{ context: { type: ctx }, severity: sev }] })
      });
      if (r.ok || r.status === 204) { cfgMsg('Config updated ✓', true); await fetchConfig(); await fetchEntries(); }
      else cfgMsg(`Error ${r.status}`, false);
    } catch(e) { cfgMsg(e.message, false); }
  });

  document.getElementById('btn-reset').addEventListener('click', async () => {
    try {
      const r = await fetch(CONFIG_URL, { method: 'DELETE' });
      if (r.ok || r.status === 204) { cfgMsg('Config reset ✓', true); await fetchConfig(); await fetchEntries(); }
      else cfgMsg(`Error ${r.status}`, false);
    } catch(e) { cfgMsg(e.message, false); }
  });

  // ── event listeners ─────────────────────────────────────────────────
  document.getElementById('cfg-ctx').addEventListener('change', renderConfig);
  document.getElementById('f-sev').addEventListener('change', fetchEntries);
  document.getElementById('f-txt').addEventListener('input', render);
  ['after-h','after-m','after-s','before-h','before-m','before-s'].forEach(id =>
    document.getElementById(id).addEventListener('change', render)
  );
  document.getElementById('btn-clear-time').addEventListener('click', () => {
    ['after-h','after-m','after-s','before-h','before-m','before-s'].forEach(id =>
      document.getElementById(id).value = ''
    );
    render();
  });
  document.getElementById('btn-ref').addEventListener('click', fetchEntries);
  document.getElementById('auto').addEventListener('change', e => {
    e.target.checked ? startTimer() : stopTimer();
  });
  document.getElementById('det-close').addEventListener('click', () =>
    document.getElementById('detail').classList.remove('open')
  );

  // ── helpers ─────────────────────────────────────────────────────────
  function normSev(s) {
    if (!s) return 'INFO';
    const u = s.toUpperCase().replace('DLT_','');
    return ['FATAL','ERROR','WARN','INFO','DEBUG'].includes(u) ? u : 'INFO';
  }

  function fmtCtx(c) {
    if (!c) return '—';
    if (c.type === 'AUTOSAR_DLT') return `DLT · ${c.application_id||''}/${c.context_id||''}`;
    return `${c.type||''}${c.host ? ' · '+c.host : ''}${c.process ? ' · '+c.process : ''}`;
  }

  // ── populate time dropdowns (24h UTC) ─────────────────────────────────
  ['after-h','before-h'].forEach(id => {
    const el = document.getElementById(id);
    for (let h = 0; h < 24; h++)
      el.innerHTML += `<option value="${h}">${String(h).padStart(2,'0')}</option>`;
  });
  ['after-m','before-m','after-s','before-s'].forEach(id => {
    const el = document.getElementById(id);
    for (let v = 0; v < 60; v++)
      el.innerHTML += `<option value="${v}">${String(v).padStart(2,'0')}</option>`;
  });

  function getTimeSecs(prefix) {
    const h = document.getElementById(`${prefix}-h`).value;
    const m = document.getElementById(`${prefix}-m`).value;
    const s = document.getElementById(`${prefix}-s`).value;
    if (h === '') return null;  // hour must be set; m and s default to 0
    return +h * 3600 + (+m||0) * 60 + (+s||0);
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function setDot(ok, txt) {
    document.getElementById('dot').className = ok ? 'ok' : 'err';
    document.getElementById('status').textContent = ok ? 'connected' : `error: ${txt}`;
  }

  function cfgMsg(text, ok) {
    const el = document.getElementById('cfg-msg');
    el.textContent = text;
    el.className = ok ? 'ok' : 'err';
    setTimeout(() => { el.className=''; el.style.display='none'; }, 3000);
  }

  function showDetail(e) {
    document.getElementById('det-body').textContent = JSON.stringify(e, null, 2);
    document.getElementById('detail').classList.add('open');
  }

  function startTimer() { timer = setInterval(fetchEntries, 3000); }
  function stopTimer()  { clearInterval(timer); }

  // ── boot ────────────────────────────────────────────────────────────
  fetchEntries();
  fetchConfig();
  startTimer();
</script>
</body>
</html>
