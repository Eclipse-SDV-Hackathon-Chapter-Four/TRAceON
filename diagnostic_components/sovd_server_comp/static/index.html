<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRAceON — SOVD Log Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --fatal: #ff7b72;
      --error: #ffa657;
      --warn: #e3b341;
      --info: #3fb950;
      --debug: #8b949e;
    }

    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; }

    header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 24px; border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    header h1 { font-size: 18px; font-weight: 600; color: var(--accent); }
    header .subtitle { color: var(--muted); font-size: 12px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--info); margin-left: auto; }
    .status-dot.error { background: var(--fatal); }
    #status-label { font-size: 12px; color: var(--muted); }

    main { display: grid; grid-template-columns: 1fr 340px; gap: 0; height: calc(100vh - 53px); }

    /* ── Log panel ── */
    .log-panel { display: flex; flex-direction: column; border-right: 1px solid var(--border); }

    .toolbar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 10px 16px; border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .toolbar label { color: var(--muted); font-size: 12px; }
    select, input[type=text] {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 5px 10px; font-size: 13px; outline: none;
    }
    select:focus, input:focus { border-color: var(--accent); }
    button {
      background: var(--accent); color: #0d1117; border: none; border-radius: 6px;
      padding: 5px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    button.secondary {
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
    }
    button:hover { opacity: 0.85; }
    .spacer { flex: 1; }
    #entry-count { font-size: 12px; color: var(--muted); }

    .log-table-wrap { flex: 1; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      position: sticky; top: 0; background: var(--surface);
      padding: 8px 12px; text-align: left; font-size: 12px;
      color: var(--muted); border-bottom: 1px solid var(--border); font-weight: 500;
    }
    tbody tr { border-bottom: 1px solid #21262d; transition: background 0.1s; }
    tbody tr:hover { background: #1c2128; cursor: pointer; }
    tbody td { padding: 7px 12px; font-size: 13px; vertical-align: top; }
    td.sev { font-weight: 700; font-size: 11px; white-space: nowrap; }
    td.ts  { color: var(--muted); font-size: 11px; white-space: nowrap; font-family: monospace; }
    td.ctx { color: var(--muted); font-size: 11px; }
    td.msg { word-break: break-word; }

    .sev-FATAL { color: var(--fatal); }
    .sev-ERROR { color: var(--error); }
    .sev-WARN  { color: var(--warn);  }
    .sev-INFO  { color: var(--info);  }
    .sev-DEBUG { color: var(--debug); }

    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 200px; color: var(--muted); gap: 8px;
    }
    .empty-state svg { opacity: 0.3; }

    /* ── Config panel ── */
    .config-panel { display: flex; flex-direction: column; overflow-y: auto; }
    .config-panel h2 {
      padding: 14px 16px; font-size: 14px; font-weight: 600;
      border-bottom: 1px solid var(--border); background: var(--surface);
    }

    .config-section { padding: 16px; border-bottom: 1px solid var(--border); }
    .config-section h3 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }

    .sev-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 0; border-bottom: 1px solid #21262d;
    }
    .sev-row:last-child { border-bottom: none; }
    .sev-label { font-size: 13px; font-weight: 600; }
    .sev-badge {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 11px; font-weight: 700;
    }
    .badge-FATAL { background: #3d1a1a; color: var(--fatal); }
    .badge-ERROR { background: #3d2a1a; color: var(--error); }
    .badge-WARN  { background: #3d3010; color: var(--warn);  }
    .badge-INFO  { background: #1a3d1a; color: var(--info);  }
    .badge-DEBUG { background: #1e2530; color: var(--debug); }

    .config-form { display: flex; flex-direction: column; gap: 10px; }
    .config-form label { font-size: 12px; color: var(--muted); }
    .config-form select { width: 100%; }
    .config-actions { display: flex; gap: 8px; margin-top: 4px; }
    .config-actions button { flex: 1; }

    #config-msg {
      margin: 8px 16px; padding: 8px 12px; border-radius: 6px;
      font-size: 12px; display: none;
    }
    #config-msg.ok  { background: #1a3d1a; color: var(--info); display: block; }
    #config-msg.err { background: #3d1a1a; color: var(--fatal); display: block; }

    .auto-refresh { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .auto-refresh input[type=checkbox] { accent-color: var(--accent); }

    /* detail drawer */
    #detail {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--surface); border-top: 1px solid var(--border);
      padding: 14px 24px; max-height: 220px; overflow-y: auto;
      font-family: monospace; font-size: 12px; display: none;
    }
    #detail.open { display: block; }
    #detail-close {
      float: right; background: none; border: none; color: var(--muted);
      font-size: 18px; cursor: pointer; padding: 0;
    }
  </style>
</head>
<body>

<header>
  <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
    <rect width="28" height="28" rx="6" fill="#1f6feb"/>
    <path d="M7 9h14M7 14h10M7 19h12" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  </svg>
  <div>
    <h1>TRAceON</h1>
    <div class="subtitle">SOVD Log Viewer · diag-app</div>
  </div>
  <div class="status-dot" id="status-dot"></div>
  <span id="status-label">connecting…</span>
</header>

<main>
  <!-- ── Log panel ── -->
  <section class="log-panel">
    <div class="toolbar">
      <label>Severity</label>
      <select id="filter-sev">
        <option value="">All</option>
        <option value="fatal">Fatal</option>
        <option value="error">Error</option>
        <option value="warn">Warn</option>
        <option value="info">Info</option>
        <option value="debug">Debug</option>
      </select>

      <label>After</label>
      <input type="time" id="filter-after" step="1" />

      <label>Before</label>
      <input type="time" id="filter-before" step="1" />

      <button class="secondary" id="btn-clear-time">✕ Clear</button>

      <label>Search</label>
      <input type="text" id="filter-text" placeholder="message…" style="width:160px" />

      <div class="spacer"></div>

      <label class="auto-refresh">
        <input type="checkbox" id="auto-refresh" checked /> Auto-refresh
      </label>
      <button class="secondary" id="btn-refresh">↻ Refresh</button>
      <span id="entry-count"></span>
    </div>

    <div class="log-table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:80px">Severity</th>
            <th style="width:160px">Timestamp</th>
            <th style="width:200px">Context</th>
            <th>Message</th>
          </tr>
        </thead>
        <tbody id="log-body"></tbody>
      </table>
      <div class="empty-state" id="empty-state" style="display:none">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 12h6M9 16h4M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>
        </svg>
        <span>No log entries</span>
      </div>
    </div>
  </section>

  <!-- ── Config panel ── -->
  <aside class="config-panel">
    <h2>⚙ Log Configuration</h2>

    <div class="config-section">
      <div class="config-form">
        <label>Context Type</label>
        <select id="cfg-ctx-type">
          <option value="RFC5424">RFC 5424</option>
          <option value="AUTOSAR_DLT">AUTOSAR DLT</option>
          <option value="Custom">Custom</option>
        </select>

        <div id="active-config" style="padding:6px 0; font-size:12px; color:var(--muted)">Loading…</div>

        <label>Min Severity</label>
        <select id="cfg-severity">
          <option value="fatal">Fatal</option>
          <option value="error">Error</option>
          <option value="warn">Warn</option>
          <option value="info" selected>Info</option>
          <option value="debug">Debug</option>
        </select>

        <div class="config-actions">
          <button id="btn-apply">Apply</button>
          <button class="secondary" id="btn-reset">Reset</button>
        </div>
      </div>
    </div>

    <div id="config-msg"></div>
  </aside>
</main>

<!-- Entry detail drawer -->
<div id="detail">
  <button id="detail-close">✕</button>
  <pre id="detail-content"></pre>
</div>

<script>
  const BASE = 'http://172.26.10.72:8080/sovd';
  const APP  = 'hw-log';
  const ENTRIES_URL = `${BASE}/v1/apps/${APP}/logs/entries`;
  const CONFIG_URL  = `${BASE}/v1/apps/${APP}/logs/config`;

  const SEV_ORDER = ['Fatal','Error','Warn','Info','Debug'];
  const CTX_LABELS = { 'RFC5424': 'RFC 5424', 'AUTOSAR_DLT': 'AUTOSAR DLT' };

  let allEntries = [];
  let allConfig  = [];   // full config list cached from last GET
  let currentCtxFilter = null; // null = show all, string = filter by context type
  let refreshTimer = null;

  // ── Fetch log entries ──────────────────────────────────────────────
  async function fetchEntries() {
    const sev   = document.getElementById('filter-sev').value;
    const after  = document.getElementById('filter-after').value;
    const before = document.getElementById('filter-before').value;
    const params = new URLSearchParams();
    if (sev)    params.set('severity',       sev.toLowerCase());
    if (after)  params.set('created-after',  toISO(after));
    if (before) params.set('created-before', toISO(before));
    const url = params.size ? `${ENTRIES_URL}?${params}` : ENTRIES_URL;
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const data = await r.json();
      allEntries = data.items ?? data ?? [];
      setStatus(true);
    } catch (e) {
      setStatus(false, e.message);
      allEntries = [];
    }
    renderEntries();
  }

  function renderEntries() {
    const text   = document.getElementById('filter-text').value.toLowerCase();
    const ctxSel = currentCtxFilter;  // null means show all
    const rows = allEntries.filter(e => {
      if (ctxSel && e.context?.type !== ctxSel) return false;
      return !text || (e.msg ?? '').toLowerCase().includes(text);
    });

    const tbody = document.getElementById('log-body');
    const empty = document.getElementById('empty-state');

    if (rows.length === 0) {
      tbody.innerHTML = '';
      empty.style.display = 'flex';
      document.getElementById('entry-count').textContent = '0 entries';
      return;
    }
    empty.style.display = 'none';
    document.getElementById('entry-count').textContent = `${rows.length} entr${rows.length === 1 ? 'y' : 'ies'}`;

    tbody.innerHTML = rows.map((e, i) => {
      const sev = e.severity ?? 'info';
      const sevUp = sev.charAt(0).toUpperCase() + sev.slice(1).toLowerCase();
      const ts  = e.timestamp ? new Date(e.timestamp).toLocaleTimeString() : '—';
      const ctx = CTX_LABELS[e.context?.type] ?? e.context?.type ?? '—';
      const host = e.context?.host ? ` · ${e.context.host}` : '';
      const proc = e.context?.process ? ` · ${e.context.process}` : '';
      const appId = e.context?.application_id ? ` · ${e.context.application_id}` : '';
      const ctxId = e.context?.context_id ? `/${e.context.context_id}` : '';
      const ctxStr = e.context?.type === 'AUTOSAR_DLT' ? ctx + appId + ctxId : ctx + host + proc;
      const msg = escHtml(e.msg ?? JSON.stringify(e));
      return `<tr data-idx="${i}">
        <td class="sev sev-${sevUp.toUpperCase()}"><span class="sev-badge badge-${sevUp.toUpperCase()}">${sevUp}</span></td>
        <td class="ts">${ts}</td>
        <td class="ctx">${escHtml(ctxStr)}</td>
        <td class="msg">${msg}</td>
      </tr>`;
    }).join('');

    tbody.querySelectorAll('tr').forEach(tr => {
      tr.addEventListener('click', () => showDetail(rows[+tr.dataset.idx]));
    });
  }

  // ── Fetch config ───────────────────────────────────────────────────
  async function fetchConfig() {
    try {
      const r = await fetch(CONFIG_URL);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const data = await r.json();
      allConfig = data.contexts ?? [];
      renderActiveConfig();
    } catch {
      document.getElementById('active-config').textContent = 'Unavailable';
    }
  }

  function renderActiveConfig() {
    const ctxSel = document.getElementById('cfg-ctx-type').value;
    const item   = allConfig.find(c => c.context?.type === ctxSel);
    const el     = document.getElementById('active-config');
    if (!item) {
      el.textContent = 'No config for this context';
      return;
    }
    const sev   = item.severity ?? 'info';
    const sevUp = sev.charAt(0).toUpperCase() + sev.slice(1).toLowerCase();
    el.innerHTML = `Current threshold: <span class="sev-badge badge-${sevUp.toUpperCase()}">${sevUp}</span>`;
    // pre-select the severity dropdown to match current config
    document.getElementById('cfg-severity').value = sev.toLowerCase();
  }

  // ── Apply config ───────────────────────────────────────────────────
  document.getElementById('btn-apply').addEventListener('click', async () => {
    const ctxType = document.getElementById('cfg-ctx-type').value;
    const sev     = document.getElementById('cfg-severity').value;

    const body = {
      items: [{
        context: { type: ctxType },
        severity: sev.toLowerCase()
      }]
    };

    try {
      const r = await fetch(CONFIG_URL, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (r.status === 204 || r.ok) {
        showConfigMsg('Config updated ✓', true);
        currentCtxFilter = ctxType;  // filter log table to this context
        fetchConfig();
        fetchEntries();
      } else {
        const err = await r.text();
        showConfigMsg(`Error ${r.status}: ${err}`, false);
      }
    } catch (e) {
      showConfigMsg(e.message, false);
    }
  });

  // ── Reset config ───────────────────────────────────────────────────
  document.getElementById('btn-reset').addEventListener('click', async () => {
    try {
      const r = await fetch(CONFIG_URL, { method: 'DELETE' });
      if (r.status === 204 || r.ok) {
        showConfigMsg('Config reset ✓', true);
        // clear context filter so all entries show regardless of type
        currentCtxFilter = null;
        document.getElementById('filter-sev').value = '';
        await fetchConfig();
        await fetchEntries();
      } else {
        showConfigMsg(`Error ${r.status}`, false);
      }
    } catch (e) {
      showConfigMsg(e.message, false);
    }
  });

  // ── Auto-refresh ───────────────────────────────────────────────────
  function startRefresh() {
    stopRefresh();
    refreshTimer = setInterval(fetchEntries, 3000);
  }
  function stopRefresh() {
    if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
  }

  // also re-render when context type selector changes
  document.getElementById('cfg-ctx-type').addEventListener('change', () => {
    currentCtxFilter = document.getElementById('cfg-ctx-type').value;
    renderActiveConfig();
    renderEntries();
  });
  document.getElementById('auto-refresh').addEventListener('change', e => {
    e.target.checked ? startRefresh() : stopRefresh();
  });
  document.getElementById('btn-refresh').addEventListener('click', fetchEntries);
  document.getElementById('filter-sev').addEventListener('change', fetchEntries);
  document.getElementById('btn-clear-time').addEventListener('click', () => {
    document.getElementById('filter-after').value = '';
    document.getElementById('filter-before').value = '';
    fetchEntries();
  });
  document.getElementById('filter-after').addEventListener('change', fetchEntries);
  document.getElementById('filter-before').addEventListener('change', fetchEntries);
  document.getElementById('filter-text').addEventListener('input', renderEntries);

  // ── Detail drawer ──────────────────────────────────────────────────
  function showDetail(entry) {
    document.getElementById('detail-content').textContent = JSON.stringify(entry, null, 2);
    document.getElementById('detail').classList.add('open');
  }
  document.getElementById('detail-close').addEventListener('click', () => {
    document.getElementById('detail').classList.remove('open');
  });

  // ── Status indicator ───────────────────────────────────────────────
  function setStatus(ok, msg) {
    const dot   = document.getElementById('status-dot');
    const label = document.getElementById('status-label');
    dot.className = 'status-dot' + (ok ? '' : ' error');
    label.textContent = ok ? 'connected' : `error: ${msg}`;
  }

  // ── Helpers ────────────────────────────────────────────────────────
  function toISO(timeStr) {
    const d = new Date();
    const [h, m, s] = timeStr.split(':');
    d.setHours(+h, +m, +(s||0), 0);
    return d.toISOString();
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function showConfigMsg(msg, ok) {
    const el = document.getElementById('config-msg');
    el.textContent = msg;
    el.className = ok ? 'ok' : 'err';
    setTimeout(() => { el.className = ''; el.style.display = 'none'; }, 3000);
  }

  // ── Boot ───────────────────────────────────────────────────────────
  fetchEntries();
  fetchConfig();
  startRefresh();
</script>
</body>
</html>
