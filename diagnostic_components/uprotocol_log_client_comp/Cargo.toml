[package]
name = "uprotocol_log_client_comp"
version.workspace = true
edition.workspace = true
description = "uProtocol client/adapter that lets the SOVD server fetch ECU logs via the getLogs RPC, implementing opensovd_core::LogProvider without the toos-api codegen layer."

[dependencies]
opensovd-core = { workspace = true }
up-rust = { version = "0.9", default-features = false, features = ["communication", "util"] }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
