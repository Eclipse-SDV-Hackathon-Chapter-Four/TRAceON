# TRAceON Cargo workspace.
#
# Only the TRAceON-owned diagnostic components are workspace members. The
# OpenSOVD crates live in the `open_source/opensovd-core` git submodule, which
# is its own workspace; they are consumed here as path dependencies, not as
# members, so the two workspaces do not collide.
[workspace]
members = [
    "diagnostic_components/sovd_server_comp",
    "diagnostic_components/uprotocol_log_client_comp",
]
# The submodule is its own workspace; exclude it so its crates inherit from the
# submodule's workspace root, not this one.
exclude = ["open_source/opensovd-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# OpenSOVD (git submodule, path dependencies)
opensovd-core = { path = "open_source/opensovd-core/opensovd-core" }
opensovd-server = { path = "open_source/opensovd-core/opensovd-server" }

# TRAceON components
uprotocol_log_client_comp = { path = "diagnostic_components/uprotocol_log_client_comp" }

# Third-party
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
