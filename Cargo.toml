# TRAceON Cargo workspace. OpenSOVD remains a separate workspace in the
# submodule and is consumed here through path dependencies.
[workspace]
members = [
    "diagnostic_components/sovd_server_comp",
    "diagnostic_components/uprotocol_log_client_comp",
    "diagnostic_components/dummy_diag_app",
]
exclude = ["open_source/opensovd-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
opensovd-core = { path = "open_source/opensovd-core/opensovd-core" }
opensovd-server = { path = "open_source/opensovd-core/opensovd-server" }
uprotocol_log_client_comp = { path = "diagnostic_components/uprotocol_log_client_comp" }

async-trait = "0.1"
axum = { version = "0.8", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures = { version = "0.3", default-features = false }
serde_json = { version = "1", default-features = false }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.7", default-features = false, features = ["fs", "cors"] }
up-transport-zenoh = "0.9"
